- Interface : User vs Environment : Self
- Navigation is the fundamental affordance of interfaces
- Navigation as labyrinths: the archetype of transformation (Jung)
- Interface -> Navigation -> Transformation
- Fox introduces the archetype of the labyrinth, focusing on its unwinding. Waclaw takes that unwinding further making visual music and emphasizing an interesting aspect of Alexander's living structure.
- Returning to the Roomba, exiting to world is a total existential shift.
- The world humans inhabit is more complex than the Roomba. But this umwelt is still a limited one, limited to our senses and neurological constraints. But let's move on to a simpler example of change in existential frame (move on to Redolfi)
- Redolfi and water then leads to environments
- Both Redolfi and Environments suggest sound has an interesting relationship to environment - echolocation gives a particularly lucid example
- Are environments a special category of interfaces, in that they afford both navigation and transformation?
- Tempting to say that the set of all interfaces circumscribes the umwelt? But as we already noted, interfaces are porous and complex, not simple flat surfaces. We see in the example of environments that 
- If the interface constructs the user, the environment constructs the self

By the time to get to Alexander, we get to start asking more interesting questions about the nature of self. As a user, when you share a piece of content onto a given platform, you're in a process of active exchange. A part of you goes into the system, and a part of the system goes into you. There is no clean interface. So 

Section I: Electronic interfaces
* printed circuit keyboard (a later development that allows the language of the interior to be expressed directly on the surface, meeting human touch)
* printed circuit boards (originally developed to enable mass production of an electronic design)
* alternatively, early touchscreen technology at CERN also enabled the combination of touch with an arbitrary underlying visual language
* take a step back: what is an interface? an exterior point of contact between two interiors -- a point of interaction against a system or environment
* interaction with an interface produces some state change in the system that is discernible to the user as being either closer or further from a desired state.
* we can look to the origins of intelligent navigation in the development of bilaterians.
* Bilaterians make up 95% of the species on this planet, a reflection of the evolutionary pressures situated at the intersection of environmental affordances and biological opportunities.
* topic of navigation could segue here to Terry Fox and Szpakowski
* In Terry Fox's labyrinths, he focuses in on the labyrinth as a journey of experience and transformation, and he transcribes the movemennts of the Chartres into scores for arranging sounds
* A few decades before him, Wacław Szpakowski's Rhythmical Lines is a score for the visual experience of the work. these lines were themselves a stand-in for music
* In these visual examples, navigation takes on shape as choreography, one in which the observer partakes metaphorically to reach a destination (aka transformation). environment, in abstraction, becomes open-ended.
* The simple graphical interfaces we've become accustomed to smooth out our world, and to which our subjectivity is reduced and constructed into a user. These visual scores remind us that interfaces can also be expansive.
* In Christopher Alexander's Fifteen Properties of Living Structures, he includes discussion of deep interlock, which we can take on as an expression of a core ambivalence about individuality and a related constellation of dyads: ornamentation and form, inside-outside, self and environment, foreground-background, surface-interior
Section: Interface to environment
* We've established thus far that interfaces mediate the environment. which leads to the question of what is the biology of environment? What is the world like to a roomba? (video of roomba escaping)
* Roomba escaping containment - interfaces in this larger sense can guide the experience towards. By controlling aspects of the environment, you influence behavior but don't determine it
* Redofli's sonic waters defamilarize an established space, the pool, augmenting it with a sensory experience that is somehow both extrinsic and intrinsic. What if sound was something you literally swam in? And leads to a more complex question: what exactly is the relationship betwewen sound and environment?
* this mode of listening points back to pre-human forms of listening, as you can also see with things like bats (echolocation) and water striders (hydroacoustics)
* To partly answer the question you can look to neurobiology, and the MSO that is responsible explicitly for the spatial interpretation of sound.
* maybe add psychologically ultimate seashore here, as its suggestive of sound itself as a kind of interface
* Binaural beating is a special category within psychoacoustics that works with the MSO to create a kind of para-spatial music, that interpenetrates inside and outside
* Monroe's Gateway Process is a set of exercises that leads you into out of body experiences and altered states of consciousness.


* Section: Through Environment to the Self
* our senses, the surface of our bodies, then are also interfaces
* question: is music itself an interface? or is it a medium through which interfaces can be defined?
* Alvin Lucier's music deals with sound as a physical medium, which you both listen to and also become more aware of how you hear. it's not about the music itself, but about the phenomenlology of how you experience it.

* engagement with interfaces and environments is ultimately not a one-directional process, but one in which the individual also seeks some form of state change, whether one of feeding or another form of growth or integration.

* sound is interesting as a sense, because it allows us to interface with an environment in action and flux. unlike the visual, in which you can see something still, you cannot hear something that is not in motion. it also helps if you stop moving, in order to hear more closely. sound becomes a priviliged medium in which you let the environment act upon you, instead of vice versa.
* sound is a privileged medium for the experience of environment :: psychologically perfect seashore
* Redolfi's sonic waters further emphasizes the ways in which the environment is shaped in order to make the experience of sound itself more an environment unto itself
* Question: if sound is an interface, and one side is the environment, what is the listening subject on the inside of the interface? (segue to more paranormal)



Medium: the material-sensory substrate through which experience is conducted
Interface: the specific point of contact through which experience is conducted. Interface is the medium-specific interaction of two interiors
Form: the way in which experience is conducted through a medium, across an interface
* I'm interested in ways of choreographing experience (form) in ways that situate the interface as a deep interlock, which I would further claim is a general condition of any interfacem in spite of qualities of slickness, flatness, seamlessness (christopher alexander)
Sound is then a medium through which the other side is the sea as an interpenetrating total environment.

From interface to environment
Beyond user experience - user choreography (scores)

What's the hook?
- Project Stargate and using audio to induce out of body experiences
- Redolfi's swimming pool concerts

<script type="application/json" id="arena-data">{"blocks":[{"id":50574045,"title":"Hugh Le Caine | Printed Circuit Keyboard (1962)","description":"Hugh Le Caine's printed circuit keyboard is a pioneering development in the field of electronic interfaces, bring technology for printing circuit boards to the surface.","src":"https://d2w9rnfcy7mm78.cloudfront.net/50574045/original_e48a2b24010b8d2efaab922a1c019537.gif?1789822886?bc=0","source":"https://www.hughlecaine.com/en/prcirkb.html"},{"id":51238095,"title":"Printed Circuit Boards","description":"Printed circuit boards (PCBs), first developed in 1936, enabled mass production of electronic designs, an advantage over wiring components by hand","src":"https://www.pcbrunner.com/wp-content/uploads/2026/01/The-First-Breakthrough_-1903-1920s.webp","source":"https://www.pcbrunner.com/circuit-board-manufacturing-history-the-rise-and-impact-of-pcbs/"},{"id":51242022,"title":"Don Buchla | Music Easel (1973)","description":"A more commercial but still extremely niche approach to keyboard interfaces to electronic music instruments came with Buchla's Music Easel, a concession to instrumentalists who wanted to a more standard way of playing his synthesizers. But unlike other keyboards, this interface allowed touch to influence any number of sonic parameters, not just the musical pitch.","src":"https://insheepsclothinghifi.com/wordpress/wp-content/uploads/2021/06/external-content.duckduckgo.jpg","source":"https://insheepsclothinghifi.com/buchla-music-easel/"},{"id":29332478,"title":"CERN | Early capacitive touch screens at CERN","description":"Elsewhere in the 1970s, CERN developed a touch-sensitive terminal that allowed for the control of procedures in particle accelerator experiments. Like touch sensitive keyboards, this also used copper traces to correlate changes in capacitance in the user's touch to areas of the screen","src":"https://cerncourier.com/wp-content/uploads/2010/03/CCtou4_04_10.jpg","source":"https://cerncourier.com/a/the-first-capacitative-touch-screens-at-cern/"},{"id":"what-is-an-interface","title":"What IS an interface?","description":"Using copper in these early touch interfaces, the human hand could engage with arbitarily complex systems, as long as that interaction could be reducible to binary operations (start/stop, on/off, etc.) or the gradations of a scalar value (e.g. volume level). This much follows the historical techno-centric definition of an interface. This reduction to binary operations has a parallel in the evolution of intelligent biology.","src":"https://cerncourier.com/wp-content/uploads/2010/03/CCtou4_04_10.jpg","source":""},{"id":51326386,"title":"Max Bennett | A Brief History of Intelligence","description":"Bennett's survey of intelligence in early life on earth makes a distinction between two types of symmetry: radial and bilateral. Compared to radial symmetry, bilateral symmetry allows complex navigation to emerge from a series of simple binary choices. Bilaterians now comprise nearly 100% of animal life on this planet.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiI1MTMyNjM4Ni9vcmlnaW5hbF83MDQ2MmZhMWQ5NDJlNjA4ODlmYjlmOGVkNjI4MTcyYy5qcGciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":null},{"id":51326410,"title":"What is it like to be a Roomba?","description":"Bennett also draws a comparison to early versions of the Roomba, which did not construct models of its environment. Instead, like a bilaterian, it used proximity sensors to inform changes in direction. The term 'umwelt' describes the world perceived by a living organism, shaped by its cognitive and sensory capabilities. In this sense, the Roomba has its own umwelt, fit to its twin goals in life: to vacuum floors and to recharge when running low on battery.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiI1MTMyNjQxMC9vcmlnaW5hbF9lNTY4M2ExYTU0ZTk0M2U2YmI5OTMwMTc2YTVkNDhlMy5qcGciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":null},{"id":32977601,"title":"Bilaterian navigation and the archetype of the labyrinth","description":"Across many cultural traditions in history, this bilaterian mode of navigation is associated with the archetype of the labyrinth. The pioneering psychoanalyst Carl Jung conducted a comprehensive survey of labyrinths across across many civilizations, tracing its variations and valences but ultimately leading back to a common archetypal metaphor: that of human growth and individuation through the winding journey of the soul.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiIzMjk3NzYwMS9vcmlnaW5hbF8yOTQyYjZhODUwZWZjNzkyZDNkZDcyNTk3OTUzZTFmMS5qcGciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":"https://gettherapybirmingham.com/the-labyrinth-in-jungian-psychology-traversing-the-winding-path-of-individuation/"},{"id":51242165,"title":"Chartres Cathedral (ca. 1200)","description":"The Chartres Cathedral is a premiere example of this in medieval Europea, in which the labyrinth laid in tilework on the ground was meant to be literally traversed as a symbolic pilgrimage.","src":"https://praywithjillatchartres.com/wp-content/uploads/2015/08/LabfromOrgan013__FRch_080926.jpg","source":"https://recalling-terryfox.de/oeuvre/themes/labyrinth/"},{"id":51242165,"title":"Terry Fox's Labyrinths","description":"The artist Terry Fox focused a significant body of work on the labyrinth at the Chartres Cathedral in France. He translated the series of turns that make up the labyrinth into an experimental score for producing performances and sound art. One notable example of this is his audio mix of the purring of eleven cats according to this score.","src":"https://recalling-terryfox.de/wp-content/uploads/2021/06/04_1975-552-Steps-into-the-Labyrinth_drawing.jpg","source":"https://recalling-terryfox.de/oeuvre/themes/labyrinth/"},{"id":3350910,"title":"Wacław Szpakowski, Rhythmical Lines (1900s-1940s)","description":"Fox's unwindings of the labyrinth have a parallel to drawings made by the the Polish architect Wacław Szpakowski at the turn of the 20th century. Although he did not translate these into sounds directly, these lines are meant to be followed with the eyes as if walking an imaginary labyrinth and suggesting a kind of visual music. These more modern uses of the labyrinth that unlike for the roomba, navigation is simultaneously an inward and outward journey that is close to the heart of human experience.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiIzMzUwOTEwL29yaWdpbmFsXzEzZmZkMWUyY2M4YmFkMWQxMzYxZTVkZjFiN2I4M2IwLmpwZyIsImVkaXRzIjp7InJlc2l6ZSI6eyJ3aWR0aCI6MTgwMCwiaGVpZ2h0IjoxODAwLCJmaXQiOiJpbnNpZGUiLCJ3aXRob3V0RW5sYXJnZW1lbnQiOnRydWV9LCJ3ZWJwIjp7InF1YWxpdHkiOjc1fSwianBlZyI6eyJxdWFsaXR5Ijo3NX0sInJvdGF0ZSI6bnVsbH19?bc=1","source":null},{"id":17617185,"title":"Christopher Alexander's Fifteen Properties of Living Structures","description":"The meandering line represents movement, but lines also represent divisions. In this visual interpretation of the Fifteen Properties of Living Structures, the line of the labyrinth represents 'deep interlock' (also referred to as ambiguity, mututal embedding). Similar to 'connectedness', it shows two interlocking parts, but characterized by a level of inseparability. Deep interlock (or ambiguity, mututal embedding) as a living structure expresses the porousness of boundaries. Dyads can be simple to conceptualize as yin and yang, but their interpenetrations yield a rich confusion. Ornamentation ⊗ form, inside ⊗ outside, foreground ⊗ background, surface ⊗ interior, self ⊗ environment — these are all formulated as opposites, but each one also contains the other. Without clean boundaries, these pairings express tension more so than absolutes. A clean interface is a useful fiction at best.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiIxNzYxNzE4NS9vcmlnaW5hbF81MDNkMDJhMTQ5ZTliYjM3ZjEyMTBkYzAzZDdjNGRlOS5wbmciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":null},{"id":"escaping-containment","title":"Escaping Containment","description":"What does all this mean for the roomba, what does it become when it leaves its intended environment? What is it really turning for? There's a much larger world outside the Roomba umwelt. Interfaces mediate exchanges between the self and environment. But how is environment determined? Given an interface, what is the world on the other side?","src":"https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRgXqG0aE-C6xlrJYm8R1nh8G-DJALJ-4TiTmGRaNXx8Q&s=10","source":""},{"id":51540178,"title":"Human umwelt within the technologically mediated environment","description":"The human umwelt is broader than the roomba, but like any organism, it is still subject to constraints. But an umwelt is not a fixed thing, it can be bound down by narrow interfaces, or expanded by wide ones, as we move through both physical and virtual environments.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiI1MTU0MDE3OC9vcmlnaW5hbF84ZDA4NGY0ZDkzNGQ0YzRjNTRjODFjNTdhNzBiZTk0MC53ZWJwIiwiZWRpdHMiOnsicmVzaXplIjp7IndpZHRoIjoxODAwLCJoZWlnaHQiOjE4MDAsImZpdCI6Imluc2lkZSIsIndpdGhvdXRFbmxhcmdlbWVudCI6dHJ1ZX0sIndlYnAiOnsicXVhbGl0eSI6NzV9LCJqcGVnIjp7InF1YWxpdHkiOjc1fSwicm90YXRlIjpudWxsfX0=?bc=0","source":"https://www.nature.com/articles/s41599-023-02356-9/figures/1"},{"id":51543011,"title":"Unlike roombas, we can swim","description":"","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiI1MTU0MzAxMS9vcmlnaW5hbF85YmRmNDg1YzViZjU2YTFiNGEzOGM4Mzg2MzgxMGRlNS5wbmciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":null},{"id":50877195,"title":"Michel Redolfi | Sonic Waters at Bains de Bruxelles","description":"Redolfi's concerts of Sonic Waters defamiliarize a particular environment: the indoor pool. He augments the space with both underwater and above-water speakers to create a sense of literally swimming in sound. Even without providing explicit scores or instructions, the modification of the environment influences the behavior of the audience, with sound acting as a soft interface to individual bodies.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiI1MDg3NzE5NS9vcmlnaW5hbF9iZjE1MTUzODgyZWFhNWExNTYxNGFjOTBiOTAyOTI1My5qcGciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":"https://brussels-express.eu/sonic-waters-at-bains-de-bruxelles-a-concert-where-you-can-experience-music-under-water/"},{"id":26308153,"title":"Environments 1 | The Psychologically Ultimate Seashore (1969)","description":"While sounds of various environments can now be found everywhere from cars to devices to aid sleep, Environments was the first mass market offering of such recordings. The very first recording, titled Psychologically Ultimate Seashore, was recorded at Coney Island and manipulated at Bell Labs. Unlike the literal immersion of Redolfi's Sonic Waters, this literal recording of ocean waves is also more portable, and demonstrates how a purely aural (and in this case simulated) environment can interface to the self.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiIyNjMwODE1My9vcmlnaW5hbF8yMDdlZDI1ZTkyN2FlZDZiMjUxOGMzNDJlZmQyNjlkNS5qcGciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":"https://numeroenvironments.bandcamp.com/album/environments-1-the-psychologically-ultimate-seashore"},{"id":880304,"title":"Echolocation","description":"Sound does have a direct relationship to environment, perhaps most clearly in the case of echolocation. While you can only see ahead of you, you can hear all around you. While we usually navigate by sound in this way, we do still share common neurobiological mechanisms with bats.","src":"https://d2w9rnfcy7mm78.cloudfront.net/14294388/original_c2eddf4e2a4b1277b001af3283f92689.png?1639007103?bc=0","source":null},{"id":11635626,"title":"Sound and environment in the brainstem","description":"Neurobiologically, spatial determination does not come directly from the ears, but from a region of the brainstem known as the Medial Superior Olive. Here, sounds from the two ears are combined and slight temporal differences are used to determine the spatial location of a sound.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiIxMTYzNTYyNi9vcmlnaW5hbF9mNWU3YTUxNjUzZmUzMmQ4MWRmYzAxZmQwN2Q1N2MwZC5wbmciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":"http://www.cns.nyu.edu/~david/courses/perception/lecturenotes/localization/localization.html"},{"id":51544081,"title":"Binaural beating: deep interlock of self and environment","description":"Within the larger category of psychoacoustic phenomena (sound that you hear but don't objectively exist), binaural beating is particularly interesting for how it activates the Medial Superior Olive. Its original function, to detect spatial position, is fundamentally disoriented, and with that any meaningful distinction about where the sound 'comes from'. There is no meaningful distinction between foreground and background sound, or whether the sound is internal or external (deep interlock)","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiI1MTU0NDA4MS9vcmlnaW5hbF8zODU2NzYzN2ZhNTg3ODJlMWEwNzRlOTNlOTg2MzZkNS53ZWJwIiwiZWRpdHMiOnsicmVzaXplIjp7IndpZHRoIjoxODAwLCJoZWlnaHQiOjE4MDAsImZpdCI6Imluc2lkZSIsIndpdGhvdXRFbmxhcmdlbWVudCI6dHJ1ZX0sIndlYnAiOnsicXVhbGl0eSI6NzV9LCJqcGVnIjp7InF1YWxpdHkiOjc1fSwicm90YXRlIjpudWxsfX0=?bc=0","source":"https://brandonluumd.substack.com/p/boost-your-brainpower-with-binaural"},{"id":31147411,"title":"The Gateway Tapes","description":"","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiIzMTE0NzQxMS9vcmlnaW5hbF8yZTA3ZTA2Mjg4MDMzMTI1NTJhNGI5OTJiYzFlYTY4YS5wbmciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":"https://archive.org/details/gateway-experience-wave-1-track-1-orientation-the-gateway-tapes-no-ads/Gateway+Experience+Wave+1+Track+1+-+Orientation+THE+GATEWAY+TAPES+(NO+ADS).mp3"},{"id":21374515,"title":"Gateway Process | Consciousness Energy Grid","description":"Monroe's Gateway Process is a set of exercises that leads you into out of body experiences and altered states of consciousness.","src":"https://images.are.na/eyJidWNrZXQiOiJhcmVuYV9pbWFnZXMiLCJrZXkiOiIyMTM3NDUxNS9vcmlnaW5hbF9mZmViNWQ5YWZkNjMxNmNjYjM1MGRiNmY2NzFlNTE5NS5wbmciLCJlZGl0cyI6eyJyZXNpemUiOnsid2lkdGgiOjE4MDAsImhlaWdodCI6MTgwMCwiZml0IjoiaW5zaWRlIiwid2l0aG91dEVubGFyZ2VtZW50Ijp0cnVlfSwid2VicCI6eyJxdWFsaXR5Ijo3NX0sImpwZWciOnsicXVhbGl0eSI6NzV9LCJyb3RhdGUiOm51bGx9fQ==?bc=0","source":null},{" <script>
// ─── Config ───────────────────────────────────────────────────────────────
// PARAMS is the single source of truth: the panel, the defaults, the clamping
// and the URL round-trip are all generated from it. A new knob is one entry
// here plus one use of cfg.<id>. The page's `slideshow` frontmatter replaces
// any of the `def`s.

const DATA = JSON.parse(document.getElementById('arena-data').textContent);
const displaceMap = document.querySelector('#arena-caption-displace [data-displace-map]');
const bodyDisplaceMap = document.querySelector('#arena-body-displace [data-displace-map]');
// The description is warped by this fraction of `distort`, so one knob
// drives both filters but the running text stays legible.
const BODY_DISTORT = 0.5;

const PARAMS = [
  { id: 'interval', type: 'range', def: 5,   min: 1, max: 30,   step: 0.5, unit: 's'  },
  { id: 'fade',     type: 'range', def: 800, min: 0, max: 3000, step: 50,  unit: 'ms' },
  { id: 'zoom',     type: 'range', def: 6,   min: 0, max: 30,   step: 1,   unit: '%'  },
  { id: 'pan',      type: 'range', def: 3,   min: 0, max: 15,   step: 0.5, unit: '%'  },
  // The default is the `scale` given to displaceFilter() below the stage, so
  // the macro call is the one place to set it.
  { id: 'distort',  type: 'range', def: Number(displaceMap.getAttribute('scale')) || 0, min: 0, max: 30, step: 1, unit: 'px' },
];

const TOGGLES = [
  { id: 'captions', def: true  },
  { id: 'titles',   def: true  },
  { id: 'cover',    def: false },
  { id: 'shuffle',  def: false },
  { id: 'loop',     def: true  },
];

for (const p of PARAMS) if (p.id in DATA.settings) p.def = clampParam(p, DATA.settings[p.id]);
for (const t of TOGGLES) if (t.id in DATA.settings) t.def = Boolean(DATA.settings[t.id]);

const IDLE_MS = 2500;

function defaultCfg() {
  const c = {};
  for (const p of PARAMS) c[p.id] = p.def;
  for (const t of TOGGLES) c[t.id] = t.def;
  return c;
}

function clampParam(p, v) {
  v = Number(v);
  if (!isFinite(v)) return p.def;
  return Math.min(p.max, Math.max(p.min, v));
}

// ─── URL round-trip ───────────────────────────────────────────────────────
// Only non-defaults are serialized, so a stock slideshow has a clean URL.

function cfgFromHash(hash) {
  const cfg = defaultCfg();
  const q = new URLSearchParams((hash || '').replace(/^#/, ''));
  for (const p of PARAMS) if (q.has(p.id)) cfg[p.id] = clampParam(p, q.get(p.id));
  for (const t of TOGGLES) if (q.has(t.id)) cfg[t.id] = q.get(t.id) === 'on';
  return cfg;
}

function hashFromCfg(cfg) {
  const q = new URLSearchParams();
  for (const p of PARAMS) if (cfg[p.id] !== p.def) q.set(p.id, cfg[p.id]);
  for (const t of TOGGLES) if (cfg[t.id] !== t.def) q.set(t.id, cfg[t.id] ? 'on' : 'off');
  const s = q.toString();
  return s ? '#' + s : '';
}

// ─── Data ─────────────────────────────────────────────────────────────────

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

// The drift is seeded from the block id, so a given block always moves the
// same way — the slideshow is reproducible rather than different every run.
function motionFor(id) {
  const r = mulberry32(id);
  const zoomIn = r() < 0.5;
  const angle = r() * Math.PI * 2;
  return { zoomIn, dx: Math.cos(angle), dy: Math.sin(angle) };
}

// ─── Motion ───────────────────────────────────────────────────────────────

// k runs 0 → 1 from the *contained* end of the move to the zoomed end (or the
// reverse), and both scale and pan are driven by it. Tying them to one value
// is what guarantees the slide touches the exact contained frame — scale 1,
// no offset — at one end, which is the whole point of `contain`.
//
// Smoothstep rather than a linear ramp: zero velocity at both ends means the
// image is momentarily still at the cut, so the crossfade lands on a held
// frame instead of interrupting a drift.
function motionAt(m, u, zoomPct, panPct) {
  const e = u * u * (3 - 2 * u);
  const k = m.zoomIn ? e : 1 - e;
  const z = zoomPct / 100;
  const p = effectivePan(zoomPct, panPct);
  const tx = k * p * m.dx;
  const ty = k * p * m.dy;
  // 5 decimals, not 4: a 30% zoom held for 30s moves the scale by about 1e-4
  // per frame, which is exactly the quantum at 4 decimals — the slow end of
  // the range would stair-step instead of drifting.
  return `translate(${tx.toFixed(3)}%, ${ty.toFixed(3)}%) scale(${(1 + z * k).toFixed(5)})`;
}

// Scaling by 1+z leaves z/2 of overhang on each side, so a pan wider than that
// drags the image off its own edge and prints background. Pan is clamped to
// the headroom the zoom actually bought.
function effectivePan(zoomPct, panPct) {
  return Math.min(panPct, zoomPct / 2);
}

// ─── State ────────────────────────────────────────────────────────────────

let cfg = cfgFromHash(location.hash);
// The blocks were synced into data.json at build time — see scripts/arena-sync.mjs.
// A block marked `hidden` stays in data.json so the sync doesn't re-add it.
const deck = DATA.blocks
  .filter((b) => !b.hidden)
  .map((b) => ({ ...b, motion: motionFor(b.id) }));
let order = [];
let idx = 0;
let frontIdx = 0;
let t0 = 0;
let heldAt = 0;
let paused = false;
let idleTimer = 0;
let panelHidden = true;

const $ = (id) => {
  const el = document.getElementById(id);
  if (!el) throw new Error('missing element: ' + id);
  return el;
};

const stage = $('stage');
const layers = [$('layer-a'), $('layer-b')];
const message = $('message');
const caption = $('caption');
const capTitle = $('cap-title');
const capBody = $('cap-body');
const panel = $('panel');
const controls = $('controls');
const toggles = $('toggles');
const progressFill = $('progress-fill');
const statusEl = $('status');
const playBtn = $('play');

// ─── Panel ────────────────────────────────────────────────────────────────

const inputs = {};
const toggleBtns = {};

for (const p of PARAMS) {
  const row = document.createElement('div');
  row.className = 'row';
  const head = document.createElement('div');
  head.className = 'head';
  const name = document.createElement('span');
  name.textContent = p.id;
  const val = document.createElement('span');
  val.className = 'val';
  head.append(name, val);
  const input = document.createElement('input');
  input.type = 'range';
  input.min = p.min; input.max = p.max; input.step = p.step;
  input.value = cfg[p.id];
  input.addEventListener('input', () => {
    cfg[p.id] = clampParam(p, input.value);
    syncPanel();
    writeHash();
    renderStatus();
    if (p.id === 'distort') renderCaption();
  });
  row.append(head, input);
  controls.appendChild(row);
  inputs[p.id] = { input, val, spec: p };
}

for (const t of TOGGLES) {
  const btn = document.createElement('button');
  btn.addEventListener('click', () => {
    cfg[t.id] = !cfg[t.id];
    syncPanel();
    writeHash();
    if (t.id === 'shuffle') reorder();
    if (t.id === 'cover') stage.classList.toggle('cover', cfg.cover);
    if (t.id === 'captions' || t.id === 'titles') renderCaption();
  });
  toggles.appendChild(btn);
  toggleBtns[t.id] = btn;
}

function syncPanel() {
  for (const p of PARAMS) {
    const { input, val } = inputs[p.id];
    if (input.value !== String(cfg[p.id])) input.value = cfg[p.id];
    val.textContent = cfg[p.id] + (p.unit || '');
  }
  for (const t of TOGGLES) {
    toggleBtns[t.id].textContent = `${t.id}: ${cfg[t.id] ? 'on' : 'off'}`;
    toggleBtns[t.id].classList.toggle('active', cfg[t.id]);
  }
  playBtn.textContent = paused ? 'play' : 'pause';
}

function writeHash() {
  const h = hashFromCfg(cfg);
  history.replaceState(null, '', h || location.pathname);
}

// ─── Render ───────────────────────────────────────────────────────────────

function current() { return deck[order[idx]]; }

function reorder() {
  const at = order.length ? order[idx] : 0;
  order = deck.map((_, i) => i);
  if (cfg.shuffle) {
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
  }
  const found = order.indexOf(at);
  idx = found >= 0 ? found : 0;
  renderStatus();
}

function show(i) {
  if (!deck.length) return;
  idx = i;
  const blk = current();
  const incoming = layers[(frontIdx + 1) % 2];
  const outgoing = layers[frontIdx];
  incoming.src = blk.src;
  incoming.style.transform = motionAt(blk.motion, 0, cfg.zoom, cfg.pan);
  incoming.style.transition = `opacity ${cfg.fade}ms linear`;
  outgoing.style.transition = `opacity ${cfg.fade}ms linear`;
  incoming.style.opacity = 1;
  outgoing.style.opacity = 0;
  frontIdx = (frontIdx + 1) % 2;
  t0 = performance.now();
  heldAt = 0;
  renderCaption();
  renderStatus();
  preload(idx + 1);
  preload(idx + 2);
}

function advance(delta) {
  if (!deck.length) return;
  let next = idx + delta;
  if (next >= order.length) {
    if (!cfg.loop) { setPaused(true); return; }
    next = 0;
  }
  if (next < 0) next = order.length - 1;
  show(next);
}

const preloaded = new Set();

function preload(i) {
  if (!order.length) return;
  const blk = deck[order[((i % order.length) + order.length) % order.length]];
  if (!blk) return;
  fetchImage(blk.src);
}

function fetchImage(src) {
  if (preloaded.has(src)) return Promise.resolve();
  preloaded.add(src);
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = img.onerror = resolve;
    img.src = src;
  });
}

function renderCaption() {
  const blk = current();
  if (!blk) { caption.hidden = capTitle.hidden = true; return; }
  const title = cfg.titles ? blk.title : '';
  capTitle.textContent = title;
  capTitle.hidden = !cfg.captions || !title;
  capBody.textContent = blk.description;
  caption.hidden = !cfg.captions || !blk.description;
  displaceMap.setAttribute('scale', cfg.distort);
  bodyDisplaceMap.setAttribute('scale', cfg.distort * BODY_DISTORT);
}

function renderStatus() {
  if (!deck.length) { statusEl.textContent = ''; return; }
  const parts = [
    `${idx + 1}/${order.length}`,
    `${Number(cfg.interval).toFixed(1)}s`,
  ];
  const eff = effectivePan(cfg.zoom, cfg.pan);
  if (eff < cfg.pan) parts.push(`pan clamped to ${eff.toFixed(1)}%`);
  statusEl.textContent = parts.join(' · ');
}

// One clock drives both the drift and the dwell. Running the transform off a
// CSS animation instead would let the two ends drift apart, and the pan would
// stop finishing exactly when the slide does.
function tick(now) {
  requestAnimationFrame(tick);
  if (!deck.length) return;
  const dwell = Math.max(1, cfg.interval * 1000);
  const elapsed = paused ? heldAt : now - t0;
  const u = Math.min(1, elapsed / dwell);
  layers[frontIdx].style.transform = motionAt(current().motion, u, cfg.zoom, cfg.pan);
  progressFill.style.width = (u * 100).toFixed(2) + '%';
  if (!paused && elapsed >= dwell) advance(1);
}

function setPaused(p) {
  if (p === paused) return;
  paused = p;
  if (paused) heldAt = performance.now() - t0;
  else t0 = performance.now() - heldAt;
  syncPanel();
}

// ─── Start ────────────────────────────────────────────────────────────────

async function start() {
  if (!deck.length) {
    message.textContent = 'No blocks yet — run `npm run arena <name>` and rebuild.';
    return;
  }
  reorder();
  // Every other slide is preloaded a turn ahead, but the first has nothing
  // in front of it — without this wait its dwell burns down while the image
  // is still on the wire, and slide one flashes past.
  await fetchImage(deck[order[0]].src);
  message.hidden = true;
  show(0);
}

// ─── Wiring ───────────────────────────────────────────────────────────────

$('prev').addEventListener('click', () => advance(-1));
$('next').addEventListener('click', () => advance(1));
playBtn.addEventListener('click', () => setPaused(!paused));

document.addEventListener('keydown', (e) => {
  if (e.target.tagName === 'INPUT') return;
  if (e.key === 'ArrowRight') { advance(1); e.preventDefault(); }
  else if (e.key === 'ArrowLeft') { advance(-1); e.preventDefault(); }
  else if (e.key === ' ') { setPaused(!paused); e.preventDefault(); }
  else if (e.key === 'f') toggleFullscreen();
  else if (e.key === 'c') { cfg.captions = !cfg.captions; syncPanel(); writeHash(); renderCaption(); }
  else if (e.key === 'h') { panelHidden = !panelHidden; panel.hidden = panelHidden; }
});

function toggleFullscreen() {
  if (document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen().catch(() => {});
}

function wake() {
  stage.classList.remove('idle');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => stage.classList.add('idle'), IDLE_MS);
}

// On touch screens there are no keys, so a tap anywhere outside the panel
// steps forward. Only touch, and only a tap — a drag that moved is ignored.
let tapStart = null;
stage.addEventListener('pointerdown', (e) => {
  tapStart = e.pointerType === 'touch' && !panel.contains(e.target) ? { x: e.clientX, y: e.clientY } : null;
});
stage.addEventListener('pointerup', (e) => {
  if (!tapStart || e.pointerType !== 'touch') return;
  const moved = Math.hypot(e.clientX - tapStart.x, e.clientY - tapStart.y);
  tapStart = null;
  if (moved < 10) advance(1);
});
stage.addEventListener('pointercancel', () => { tapStart = null; });

document.addEventListener('mousemove', wake);
document.addEventListener('mousedown', wake);
window.addEventListener('hashchange', () => {
  cfg = cfgFromHash(location.hash);
  syncPanel();
  stage.classList.toggle('cover', cfg.cover);
  reorder();
  renderCaption();
  renderStatus();
});

stage.classList.toggle('cover', cfg.cover);
syncPanel();
wake();
requestAnimationFrame(tick);
start();
</script>

  </body>
</html>
